spring:
  datasource:
    url: jdbc:h2:mem:pfm;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

app:
  jwt:
    secret: test-secret-key-test-secret-key-test-secret-key
    access-token-minutes: 15
    refresh-token-days: 7
